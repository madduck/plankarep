[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "plankarep"
description = "Instantiate Jinja2 templates from Planka data gathered via plnk."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Martin F. Krafft", email = "plankarep@pobox.madduck.net" }]
keywords = ["planka", "jinja2", "template", "report", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "click>=8.1",
  "jinja2>=3.1",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/madduck/plankarep"
Repository = "https://github.com/madduck/plankarep"
Issues = "https://github.com/madduck/plankarep/issues"

[project.scripts]
plankarep = "plankarep.cli:main"

[dependency-groups]
dev = [
  "bandit>=1.9",
  "ipdb>=0.13",
  "mypy>=1.0",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.17",
  "types-setuptools>=70.0",
]
scripts = [
  "markdown2>=2.5",
  "matrix-nio>=0.26",
]

[tool.setuptools_scm]
version_file = "plankarep/_version.py"

[tool.setuptools.packages.find]
include = ["plankarep*"]

# ---------------------------------------------------------------------------
# pytest / coverage
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=plankarep",
  "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["plankarep"]

[tool.coverage.report]
fail_under = 100
show_missing = true
# Coverage is measured for the whole suite. Run `uv run pytest` without a
# subset so that the threshold is meaningful.
skip_covered = true
exclude_also = [
  'def __repr__',
  'if TYPE_CHECKING:',
  'class .*\bProtocol\):',
  '@overload',
  '@(abc\.)?abstractmethod',
  'raise NotImplementedError',
  'raise AssertionError',
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["plankarep", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "D",
  "DTZ",
  "E",
  "ERA",
  "F",
  "I",
  "N",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "SIM",
  "T10",
  "TCH",
  "UP",
  "W",
]
ignore = [
  "D203", # one-blank-line-before-class (prefer D211)
  "D212", # multi-line-summary-first-line (prefer D213)
  "TC001", # runtime imports are clearer than type-checking blocks
  "TC002",
  "TC003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103", "PLC0415"]
"setup.py" = ["PTH", "T20"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
warn_unreachable = true
strict = true
files = ["plankarep", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["ipdb", "markdown2", "nio"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# ---------------------------------------------------------------------------
# bandit
# ---------------------------------------------------------------------------

[tool.bandit]
exclude_dirs = [".venv", "build", "dist"]
# B404: importing subprocess is intentional in the runner and build hook.
skips = ["B404"]

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/tests/*", "*/conftest.py"]
